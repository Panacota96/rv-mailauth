[package]
name = "rv-mailauth-gui"
description = "RV MailAuth desktop interface (Windows 10/11, also builds on Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "rv-mailauth-gui"
path = "src/main.rs"

[lib]
name = "rv_mailauth_gui"
path = "src/lib.rs"

[dependencies]
rv-mailauth-core.workspace = true
eframe.workspace = true
serde_json.workspace = true

# Native file/folder pickers on Windows (no GTK/portal dependency elsewhere: a text field is used instead).
[target.'cfg(windows)'.dependencies]
rfd.workspace = true

# Icon + version details in the Windows .exe (build.rs; does nothing on other platforms).
[build-dependencies]
winresource = "0.1"

# The documentation screenshots (examples/gui_screenshot.rs) are written as PNG.
[dev-dependencies]
png = "0.18"
